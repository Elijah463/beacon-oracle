app = "beacon-oracle-reporter"
primary_region = "ams"

[build]

[env]
  PORT = "8080"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[services]]
  internal_port = 8080
  protocol      = "tcp"
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port     = 80
    handlers = ["http"]

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval      = 30000
    timeout       = 5000
    grace_period  = "10s"
    method        = "GET"
    path          = "/health"
    protocol      = "http"

[[restart]]
  policy = "always"
