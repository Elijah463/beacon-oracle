# fly.toml -- BEACON Oracle reporter on Fly.io
#
# First time setup:
#   1. fly launch --no-deploy
#   2. fly secrets set CIRCLE_API_KEY=... CIRCLE_ENTITY_SECRET=... \
#        REPORTER_WALLET_ID=... REPORTER_WALLET_ADDRESS=... \
#        REPORTER_SIGNING_KEY=... NGN_PROXY_URL=...
#   3. fly deploy
#
# Subsequent deploys: fly deploy

app            = "beacon-oracle-reporter"
primary_region = "lhr"

[build]
  # Dockerfile is in the repo root.

[env]
  VITE_ORACLE_CONTRACT_ADDRESS = "0x8A9bC80E846125ABA50B8936fD47cdB7cBc44797"

# No [[services]] block -- this is a pure background worker with no HTTP port.
# The Dockerfile CMD runs the reporter directly.
# Fly keeps it alive and restarts on crash via the [[restart]] policy below.

[[restart]]
  policy      = "always"
  max_retries = 10
