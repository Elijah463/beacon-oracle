# fly.toml -- BEACON Oracle reporter on Fly.io
# First time setup:
#   1. fly launch --no-deploy  (imports this config, creates the app)
#   2. fly secrets set CIRCLE_API_KEY=... CIRCLE_ENTITY_SECRET=... REPORTER_WALLET_ID=... REPORTER_WALLET_ADDRESS=... REPORTER_SIGNING_KEY=... NGN_PROXY_URL=...
#   3. fly deploy
#
# Subsequent deploys: fly deploy

app            = "beacon-oracle-reporter"
primary_region = "lhr"

[build]
  # Dockerfile is in the repo root -- Fly detects it automatically.
  # Uses Bun runtime (Fly's built-in Node runtime does not include Bun).

[env]
  # Public env var -- safe to commit. Secrets go via: fly secrets set KEY=value
  VITE_ORACLE_CONTRACT_ADDRESS = "0x8A9bC80E846125ABA50B8936fD47cdB7cBc44797"

# No HTTP service -- pure background worker.
[processes]
  reporter = "bun run scripts/reporter.ts"

[[restart]]
  policy      = "always"
  max_retries = 10
