# fly.toml app configuration file generated for beacon-oracle on 2026-10-25T22:13:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'beacon-oracle'
primary_region = 'lhr'

[build]

[env]
  VITE_ORACLE_CONTRACT_ADDRESS = '0x8A9bC80E846125ABA50B8936fD47cdB7cBc44797'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[restart]]
  policy = 'always'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
